name = "crosmos-ingestion"
main = "src/index.ts"
compatibility_date = "2024-12-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
logpush = true

# Top-level resources are local-development defaults. Production is the only
# supported deployed environment and is always selected explicitly.
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[dev]
port = 8788
inspector_port = 9230

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f5a4b0b3c894450f9ad332221a92ff5a"
localConnectionString = "postgresql://crosmos:crosmos@localhost:5433/crosmos"

[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "ingestion-jobs-dev"

[[queues.consumers]]
queue = "ingestion-jobs-dev"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 15
max_concurrency = 10
dead_letter_queue = "ingestion-jobs-dev-dlq"

[[queues.consumers]]
queue = "ingestion-jobs-dev-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[ai]
binding = "AI"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_ingestion_dev"

[[vectorize]]
binding = "MEMORIES_INDEX"
index_name = "crosmos-memories-dev"

[[vectorize]]
binding = "ENTITIES_INDEX"
index_name = "crosmos-entities-dev"

[vars]
ENVIRONMENT = "development"
LLM_PROVIDER = "openrouter"
EMBEDDINGS_PROVIDER = "workers-ai"
VECTOR_STORE = "vectorize"

[env.production]
workers_dev = false
logpush = true

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
destinations = ["grafana-logs"]

[env.production.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
destinations = ["grafana-traces"]

# Production provider contract. Keep aligned with the API manifest and its
# executable deployment-config test.
[env.production.vars]
ENVIRONMENT = "production"
LLM_PROVIDER = "openai"
EMBEDDINGS_PROVIDER = "openai"
VECTOR_STORE = "qdrant"
EMBEDDING_DIMENSIONS = "1536"
QDRANT_URL = "https://413d870d-6737-407d-b9f9-7cd92cf76fe7.us-east-1-1.aws.cloud.qdrant.io"

[env.production.placement]
mode = "targeted"
region = "aws:us-east-1"

[env.production.ai]
binding = "AI"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_ingestion"

# Retained rollback bindings; inactive while VECTOR_STORE=qdrant.
[[env.production.vectorize]]
binding = "MEMORIES_INDEX"
index_name = "crosmos-memories-v3"

[[env.production.vectorize]]
binding = "ENTITIES_INDEX"
index_name = "crosmos-entities-v3"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "53d75344f62e4e4da0974c2fdfcc5b0d"

# The producer publishes healthy checkpoint continuations to the same queue.
[[env.production.queues.producers]]
binding = "INGESTION_QUEUE"
queue = "ingestion-jobs"

[[env.production.queues.consumers]]
queue = "ingestion-jobs"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 15
max_concurrency = 10
dead_letter_queue = "ingestion-jobs-dlq"

[[env.production.queues.consumers]]
queue = "ingestion-jobs-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
