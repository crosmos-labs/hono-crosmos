name = "crosmos-ingestion"
main = "src/index.ts"
compatibility_date = "2024-12-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[dev]
port = 8788

# Hyperdrive: shared NeonDB connection pooling (same DB as the API worker)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f5a4b0b3c894450f9ad332221a92ff5a"
localConnectionString = "postgresql://crosmos:crosmos@localhost:5433/crosmos"

# Queue consumer: one ingestion job per invocation. A job may carry many
# source_ids, but each job is its own queue message; see .codex/pipelines.md.
[[queues.consumers]]
queue = "ingestion-jobs-dev"
max_batch_size = 1
# 0s = deliver as soon as a message is available, no batch-fill wait. CF Queues
# still have a cold-queue delivery-latency floor (tens of seconds when idle) —
# that's why the API worker ALSO kicks ingestion directly over a service binding
# (IngestionWorker.ingest). This queue is now the durable BACKSTOP behind that
# fast path; both paths coordinate via the atomic job claim.
max_batch_timeout = 0
# Backstop retries serve two roles: ordinary failure retries AND polling a job
# that's still healthily in flight on the RPC path (see BACKSTOP_RETRY_DELAY_SECONDS
# + JOB_LEASE_MS). max_retries * delay must outlast JOB_LEASE_MS (10m) so a
# silently-dead RPC run is reclaimed before the message DLQs: 15 * 60s = 15m.
max_retries = 15
dead_letter_queue = "ingestion-jobs-dev-dlq"

# Workers AI: embeddings (bge-m3).
[ai]
binding = "AI"

# Analytics Engine: ingestion metrics sink (outcome/latency/tokens). Created on
# first write; queried/alerted via the Analytics Engine SQL API.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_ingestion_dev"

# Vectorize: vector storage (VECTOR_STORE=vectorize). Shared with the API worker.
[[vectorize]]
binding = "MEMORIES_INDEX"
index_name = "crosmos-memories-dev"

[[vectorize]]
binding = "ENTITIES_INDEX"
index_name = "crosmos-entities-dev"

[vars]
ENVIRONMENT = "development"
# Default LLM provider for ingestion. Switch to "openai" to call OpenAI directly.
LLM_PROVIDER = "openrouter"
# Provider selection (defaults if unset: workers-ai / vectorize). Must match the API.
EMBEDDINGS_PROVIDER = "workers-ai"
VECTOR_STORE = "vectorize"

[env.production]
[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[env.production.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[env.production.vars]
ENVIRONMENT = "production"
LLM_PROVIDER = "openrouter"
EMBEDDINGS_PROVIDER = "workers-ai"
VECTOR_STORE = "vectorize"

# Workers AI binding (not inherited from top-level).
[env.production.ai]
binding = "AI"

# Analytics Engine (prod ingestion metrics sink). Not inherited from top-level.
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_ingestion"

# Vectorize (prod indexes, shared with the API worker).
[[env.production.vectorize]]
binding = "MEMORIES_INDEX"
index_name = "crosmos-memories"

[[env.production.vectorize]]
binding = "ENTITIES_INDEX"
index_name = "crosmos-entities"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "334924fce954497fbcc866b74395bca1"

[[env.production.queues.consumers]]
queue = "ingestion-jobs"
max_batch_size = 1
# 0s = deliver as soon as a message is available, no batch-fill wait. CF Queues
# still have a cold-queue delivery-latency floor (tens of seconds when idle) —
# that's why the API worker ALSO kicks ingestion directly over a service binding
# (IngestionWorker.ingest). This queue is now the durable BACKSTOP behind that
# fast path; both paths coordinate via the atomic job claim.
max_batch_timeout = 0
# See dev consumer above: max_retries * BACKSTOP_RETRY_DELAY_SECONDS must
# outlast JOB_LEASE_MS so a silently-dead RPC run is reclaimed before DLQ.
max_retries = 15
dead_letter_queue = "ingestion-jobs-dlq"
