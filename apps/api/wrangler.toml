name = "crosmos-api"
main = "src/index.ts"
compatibility_date = "2024-12-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[dev]
port = 8787

# Hyperdrive: NeonDB connection pooling
# Replace `id` after running: wrangler hyperdrive create crosmos-db --connection-string=...
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f5a4b0b3c894450f9ad332221a92ff5a"
# Local-only: wrangler dev connects here. Prod uses the configured upstream (NeonDB).
localConnectionString = "postgresql://crosmos:crosmos@localhost:5433/crosmos"

# KV: API key cache + rate limit counters
# Replace `id` after running: wrangler kv namespace create API_KEY_CACHE
[[kv_namespaces]]
binding = "API_KEY_CACHE"
id = "526c4c65675d478b827a2b0566bba1b6"

# Queue producer: ingestion jobs (consumer lives in apps/ingestion).
# Dev and prod each have their own queue so the two ingestion workers don't
# fight over the single-consumer slot Cloudflare Queues enforces.
[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "ingestion-jobs-dev"

[vars]
ENVIRONMENT = "development"
OAUTH_SERVER_BASE_URL = "http://localhost:8787"
APP_BASE_URL = "http://localhost:3000"

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
OAUTH_SERVER_BASE_URL = "https://hono.crosmos.dev"
APP_BASE_URL = "https://hono.crosmos.dev"

[[env.production.routes]]
pattern = "hono.crosmos.dev"
custom_domain = true

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "334924fce954497fbcc866b74395bca1"

[[env.production.kv_namespaces]]
binding = "API_KEY_CACHE"
id = "25fed42f4fb242acb470f7578a60b854"

[[env.production.queues.producers]]
binding = "INGESTION_QUEUE"
queue = "ingestion-jobs"
