name = "crosmos-api"
main = "src/index.ts"
compatibility_date = "2024-12-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
logpush = true

# Top-level resources are local-development defaults. Production is the only
# supported deployed environment and is always selected explicitly.
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[dev]
port = 8787
inspector_port = 9229

[triggers]
crons = ["17 3 * * *", "*/15 * * * *"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f5a4b0b3c894450f9ad332221a92ff5a"
localConnectionString = "postgresql://crosmos:crosmos@localhost:5433/crosmos"

[[kv_namespaces]]
binding = "API_KEY_CACHE"
id = "526c4c65675d478b827a2b0566bba1b6"

[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "ingestion-jobs-dev"

[[services]]
binding = "INGESTION_SERVICE"
service = "crosmos-ingestion"
entrypoint = "IngestionWorker"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_api_dev"

[[vectorize]]
binding = "MEMORIES_INDEX"
index_name = "crosmos-memories-dev"

[[vectorize]]
binding = "ENTITIES_INDEX"
index_name = "crosmos-entities-dev"

[vars]
ENVIRONMENT = "development"
OAUTH_SERVER_BASE_URL = "http://localhost:8787"
APP_BASE_URL = "http://localhost:3000"
RETRIEVAL_RERANKER_ENABLED = "true"
EMBEDDINGS_PROVIDER = "workers-ai"
RERANKER_PROVIDER = "workers-ai"
VECTOR_STORE = "vectorize"

[env.production]
workers_dev = false
logpush = true

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
destinations = ["grafana-logs"]

[env.production.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
destinations = ["grafana-traces"]

# Production provider contract. Keep aligned with the ingestion manifest and
# apps/api/tests/deployment-config.test.ts.
[env.production.vars]
ENVIRONMENT = "production"
OAUTH_SERVER_BASE_URL = "https://api.crosmos.dev"
APP_BASE_URL = "https://api.crosmos.dev"
INVITE_ACCEPT_URL = "https://console.crosmos.dev/invites/accept"
RETRIEVAL_RERANKER_ENABLED = "true"
EMBEDDINGS_PROVIDER = "openai"
RERANKER_PROVIDER = "zeroentropy"
VECTOR_STORE = "qdrant"
EMBEDDING_DIMENSIONS = "1536"
QDRANT_URL = "https://413d870d-6737-407d-b9f9-7cd92cf76fe7.us-east-1-1.aws.cloud.qdrant.io"

[env.production.placement]
mode = "targeted"
region = "aws:us-east-1"

[env.production.ai]
binding = "AI"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_api"

# Retained rollback bindings. Provider adapters remain selectable, but these
# indexes are inactive while VECTOR_STORE=qdrant.
[[env.production.vectorize]]
binding = "MEMORIES_INDEX"
index_name = "crosmos-memories-v3"

[[env.production.vectorize]]
binding = "ENTITIES_INDEX"
index_name = "crosmos-entities-v3"

[env.production.triggers]
crons = ["17 3 * * *", "*/15 * * * *"]

[[env.production.routes]]
pattern = "api.crosmos.dev"
custom_domain = true

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "53d75344f62e4e4da0974c2fdfcc5b0d"

[[env.production.kv_namespaces]]
binding = "API_KEY_CACHE"
id = "25fed42f4fb242acb470f7578a60b854"

[[env.production.queues.producers]]
binding = "INGESTION_QUEUE"
queue = "ingestion-jobs"

[[env.production.services]]
binding = "INGESTION_SERVICE"
service = "crosmos-ingestion-production"
entrypoint = "IngestionWorker"
