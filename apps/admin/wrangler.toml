name = "crosmos-admin"
main = "src/index.ts"
compatibility_date = "2024-12-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Top-level resources are local-development defaults. Production is the only
# supported deployed environment and is always selected explicitly.
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
persist = true
invocation_logs = true
head_sampling_rate = 1

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f5a4b0b3c894450f9ad332221a92ff5a"
localConnectionString = "postgresql://crosmos:crosmos@localhost:5433/crosmos"

[[kv_namespaces]]
binding = "API_KEY_CACHE"
id = "526c4c65675d478b827a2b0566bba1b6"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_admin_dev"

[[durable_objects.bindings]]
name = "ADMIN_RATE_LIMITER"
class_name = "AdminRateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdminRateLimiterDO"]

[vars]
ENVIRONMENT = "development"
ADMIN_RATE_LIMIT_PER_MINUTE = "60"

[env.production]
workers_dev = false

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
persist = true
invocation_logs = true
head_sampling_rate = 1

[[env.production.routes]]
pattern = "admin.crosmos.dev"
custom_domain = true

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "53d75344f62e4e4da0974c2fdfcc5b0d"

[[env.production.kv_namespaces]]
binding = "API_KEY_CACHE"
id = "25fed42f4fb242acb470f7578a60b854"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "crosmos_admin"

[[env.production.durable_objects.bindings]]
name = "ADMIN_RATE_LIMITER"
class_name = "AdminRateLimiterDO"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["AdminRateLimiterDO"]

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_RATE_LIMIT_PER_MINUTE = "60"

# Required production secrets/vars: ACCESS_TEAM_DOMAIN, ACCESS_AUD, and
# ADMIN_ALLOWED_EMAILS.
